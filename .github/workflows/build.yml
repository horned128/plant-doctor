name: firmware-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out Plant Doctor
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            ninja-build

      - name: Verify CMSIS
        run: |
          test -f firmware/ml63q2557/external/CMSIS/CMSIS/Core/Include/cmsis_compiler.h

      - name: Configure
        working-directory: firmware/ml63q2557
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: firmware/ml63q2557
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Report size
        run: |
          arm-none-eabi-size \
            firmware/ml63q2557/build/${{ matrix.preset }}/PlantDoctor.elf