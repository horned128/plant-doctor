name: firmware-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out Plant Doctor
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            ninja-build

      - name: Verify CMSIS
        run: |
          test -f firmware/ml63q2557/external/CMSIS/CMSIS/Core/Include/cmsis_compiler.h

      - name: Configure
        working-directory: firmware/ml63q2557
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: firmware/ml63q2557
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Report size and memory usage
        run: |
          echo "=== Summary size ==="
          arm-none-eabi-size \
            firmware/ml63q2557/build/${{ matrix.preset }}/PlantDoctor.elf
          echo "=== Section details (-A) ==="
          arm-none-eabi-size -A \
            firmware/ml63q2557/build/${{ matrix.preset }}/PlantDoctor.elf
          echo "=== Check malloc linkage ==="
          arm-none-eabi-nm firmware/ml63q2557/build/${{ matrix.preset }}/PlantDoctor.elf | grep -i malloc || echo "malloc not linked"
          echo "=== Top 20 symbols by size ==="
          arm-none-eabi-nm --print-size --size-sort --radix=d \
            firmware/ml63q2557/build/${{ matrix.preset }}/PlantDoctor.elf | tail -n 20

  host-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Plant Doctor
        uses: actions/checkout@v4

      - name: Configure host tests
        run: cmake -S tests/host -B build/host

      - name: Build host tests
        run: cmake --build build/host

      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure